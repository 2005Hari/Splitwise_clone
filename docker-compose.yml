# Two containers: the Express API and an nginx-served React build that
# proxies /api/* to it. Point DNS/a reverse proxy at the `client` service's
# port 80 and you have the whole app.
#
# NOT included here, because it's a separate project you run yourself:
# YouPI-PG (https://github.com/youpi-pg/YouPI-PG), the payment gateway.
# Deploy it on its own (its own repo has a docker-compose of its own), then
# point server/.env's YOUPI_* variables at wherever it ends up. In-app UPI
# settlement is the one feature that needs it; everything else works
# without it.
services:
  server:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
    volumes:
      - server-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  client:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # The SQLite database and uploaded receipts. Back this up — see DEPLOY.md.
  server-data:
